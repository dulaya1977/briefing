<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Ship Briefing</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        /* Quiz 專屬科技感樣式 */
        .quiz-container {
            max-width: 800px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #004080; }
        .form-group input { 
            width: 100%; padding: 12px; border: 1px solid #ccc; 
            border-radius: 6px; box-sizing: border-box; font-size: 16px;
        }
        .btn {
            background: linear-gradient(90deg, #1e3a8a 0%, #3b82f6 100%);
            color: white; border: none; padding: 12px 24px; font-size: 16px;
            border-radius: 6px; cursor: pointer; transition: 0.3s;
            display: block; width: 100%; font-weight: bold;
        }
        .btn:hover { opacity: 0.9; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }
        
        /* 題目與選項排版優化 */
        .question-block { 
            margin-bottom: 40px; 
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .question-text { 
            font-size: 1.15rem; 
            font-weight: bold; 
            margin-bottom: 20px; 
            color: #1e3a8a; 
            line-height: 1.5;
        }
        /* 題目的次要語言 */
        .lang-sub-q {
            display: block;
            font-size: 0.95rem;
            color: #555;
            font-weight: normal;
            margin-top: 4px;
        }

        .options-list { 
            display: flex;
            flex-direction: column; /* 強制垂直排列 */
            gap: 12px; /* 選項之間的間距 */
        }
        .option-item {
            display: flex; /* 使用 flexbox 讓圓圈和文字對齊 */
            align-items: flex-start;
            background: #f8fafc; 
            border: 1px solid #e2e8f0; 
            padding: 16px;
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.2s;
        }
        .option-item:hover { 
            background: #e0f2fe; 
            border-color: #7dd3fc; 
        }
        .option-item input[type="radio"] { 
            margin-top: 5px; /* 稍微往下移對齊第一行英文字 */
            margin-right: 15px; 
            transform: scale(1.2); /* 讓點選圓圈大一點 */
            cursor: pointer;
        }
        .option-text-container {
            display: flex;
            flex-direction: column; /* 選項內的三種語言垂直排列 */
            gap: 4px;
        }
        .lang-en {
            font-weight: 600;
            color: #333;
            font-size: 1.05rem;
        }
        /* 選項的次要語言 */
        .lang-sub-opt {
            font-size: 0.9rem;
            color: #64748b;
        }

        #result-screen { display: none; text-align: center; }
        .score-display { font-size: 3rem; color: #004080; font-weight: bold; margin: 20px 0; }
        /* 固定頂部導覽列 */
        nav {
            position: sticky !important;
            top: 0 !important;
            z-index: 1000 !important;
        }
        /* 隱藏/顯示控制 */
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">Harassment</a></li>
            <li><a href="stevedore.html">Stevedore</a></li>
            <li><a href="quiz.html" class="quiz-btn">Quiz</a></li>
        </ul>
    </nav>
    
    <main>
        <div class="quiz-container">
            <div id="info-screen">
                <h1 style="color: #004080; text-align: center;">Harassment Policy Quiz</h1>
                <p style="text-align: center; color: #666; margin-bottom: 30px;">Please enter your details to start the assessment.</p>
                
                <div class="form-group">
                    <label>Vessel Name</label>
                    <input type="text" id="vesselName" required placeholder="e.g. MV Wisdom">
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="userName" required placeholder="e.g. John Doe">
                </div>
                <div class="form-group">
                    <label>Rank</label>
                    <input type="text" id="userRank" required placeholder="e.g. Chief Officer">
                </div>
                <div class="form-group">
                    <label>Email Address (To receive results)</label>
                    <input type="email" id="userEmail" required placeholder="your.email@example.com">
                </div>
                <button class="btn" onclick="startQuiz()">Start Quiz</button>
            </div>

            <div id="quiz-screen" class="hidden">
                <div id="quiz-content"></div>
                <button class="btn" onclick="submitQuiz()" style="margin-top: 20px;">Submit Answers</button>
            </div>

            <div id="result-screen" class="hidden">
                <h1>Assessment Completed</h1>
                <div class="score-display">Score: <span id="final-score">0</span>%</div>
                <p>Your results and answer review have been sent to your email.</p>
                <p style="font-size: 0.9em; color: #666;">(CC: kenneth_lin@wisdomlines.com.tw)</p>
                <button class="btn" onclick="location.reload()" style="margin-top: 30px; width: auto; padding: 10px 30px; margin: 20px auto;">Retake Quiz</button>
            </div>
        </div>
    </main>

    <script>
        // ⭐ 請替換成您在 EmailJS 註冊取得的 Public Key
        emailjs.init("qYyv1wPLZyzF3V2Il"); 

        let allQuestions = [];
        let selectedQuestions = [];
        let userInfo = {};

        // 頁面載入時讀取 JSON 題庫
        window.onload = async () => {
            try {
                const response = await fetch('./harassment.json');
                allQuestions = await response.json();
            } catch (error) {
                console.error("Failed to load questions", error);
                alert("Error loading quiz data. Please make sure harassment.json is in the correct location and format.");
            }
        };

        // 開始測驗
        function startQuiz() {
            userInfo = {
                vessel: document.getElementById('vesselName').value.trim(),
                name: document.getElementById('userName').value.trim(),
                rank: document.getElementById('userRank').value.trim(),
                email: document.getElementById('userEmail').value.trim()
            };

            if(!userInfo.vessel || !userInfo.name || !userInfo.rank || !userInfo.email) {
                alert("Please fill in all fields.");
                return;
            }

            // 隨機選出 10 題
            selectedQuestions = allQuestions.sort(() => 0.5 - Math.random()).slice(0, 10);
            renderQuiz();

            document.getElementById('info-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
        }

        // 渲染題目 (更新了三種語言的排版)
        function renderQuiz() {
            const container = document.getElementById('quiz-content');
            container.innerHTML = '';

            selectedQuestions.forEach((q, index) => {
                const block = document.createElement('div');
                block.className = 'question-block';

                let optionsHtml = '';
                q.options.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <label class="option-item">
                            <input type="radio" name="q${index}" value="${optIndex}">
                            <div class="option-text-container">
                                <span class="lang-en">${opt.en}</span>
                                <span class="lang-sub-opt">${opt['zh-CN']}</span>
                                <span class="lang-sub-opt">${opt['vi']}</span>
                            </div>
                        </label>
                    `;
                });

                block.innerHTML = `
                    <div class="question-text">
                        ${index + 1}. ${q.question.en}
                        <span class="lang-sub-q">${q.question['zh-CN']}</span>
                        <span class="lang-sub-q">${q.question['vi']}</span>
                    </div>
                    <div class="options-list">
                        ${optionsHtml}
                    </div>
                `;
                container.appendChild(block);
            });
        }

        // 提交測驗與寄信
        function submitQuiz() {
            let score = 0;
            let reviewText = ""; 

            // 檢查是否全答並計分
            for (let i = 0; i < selectedQuestions.length; i++) {
                const selectedOption = document.querySelector(`input[name="q${i}"]:checked`);
                if (!selectedOption) {
                    alert(`Please answer question ${i + 1}`);
                    return;
                }
                
                const answerIndex = parseInt(selectedOption.value);
                const q = selectedQuestions[i];
                const isCorrect = answerIndex === q.correct_answer_index;
                
                if (isCorrect) score += 10;

                reviewText += `Q${i+1}: ${q.question.en}\n`;
                reviewText += `Your Answer: ${q.options[answerIndex].en}\n`;
                if (!isCorrect) {
                    reviewText += `Correct Answer: ${q.options[q.correct_answer_index].en}\n`;
                }
                reviewText += `Result: ${isCorrect ? "✅ Correct" : "❌ Incorrect"}\n\n`;
            }

            // 切換到結果畫面
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = score;

            // 呼叫 EmailJS 發信
            const templateParams = {
                user_name: userInfo.name,
                user_email: userInfo.email,
                vessel_name: userInfo.vessel,
                rank: userInfo.rank,
                score: score,
                review_content: reviewText
            };

            // ⭐ 記得替換成您自己的 Service ID 和 Template ID 才能真正寄信喔！
            emailjs.send('service_87bqiaf', 'template_9lvl93j', templateParams)
                .then(function(response) {
                   console.log('SUCCESS!', response.status, response.text);
                }, function(error) {
                   console.error('FAILED...', error);
                   alert("Quiz submitted, but there was an error sending the email.");
                });
        }
    </script>
</body>
</html>
